[project]
name = "nihongo-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matteo Magliano", email = "perfiu02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.33.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
nihongo-agent = "nihongo_agent:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
